<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* universal selector -*  */
        *{
            color: purple;
            background-color: lightyellow;
        }
        #note{
            color: red;
        }

    </style>
</head>
<body>
    <h2 class="abc">Web development</h2>

    <p class="note" style="color: saddlebrown;">This is an example of class selector</p>

    <button class="abc">Login</button>

    <p>this is universal selector</p>
</body>
</html>
