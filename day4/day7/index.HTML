<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .product{
        border: 2px solid black;
        width: 200px;
        text-align: center;
        border-radius: 12px;
        padding: 15px;
        margin: 15px;   
        background-color: antiquewhite;
        /* box-shadow: X axis Y axis Spread-radius; */
        box-shadow: 8px 7px 10px rgb(236, 111, 111);
    }
    .product:hover{
        box-shadow: 8px  7px 10px rgb(77, 5, 5);
        transition: 1s;
    }

    .product img{
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid white;
    }
    .product button{
        background-color: lightyellow;
        color: darkred;
        border: none;
        padding: 10px;
        border-radius: 10px;
    }
    .product h2{
        text-decoration: underline;
        color: brown;
    }
    body{
        display:flex;
        flex-wrap:wrap;
    }
</style>
<body>

    <div class="product">
        <img src="https://images.pexels.com/photos/33573898/pexels-photo-33573898.jpeg">
        <h2 >Cold Coffee</h2>
        <p>Rs 199.00</p>
        <button>buy now</button>
    </div>

       <div class="product">
        <img src="https://images.pexels.com/photos/3652/cookies-snack-brownies.jpg">
        <h2 >Cookies</h2>
        <p>Rs 199.00</p>
        <button>buy now</button>
    </div>

       <div class="product">
        <img src="https://images.pexels.com/photos/8625935/pexels-photo-8625935.jpeg">
        <h2>Cup Cake</h2>
        <p>Rs 199.00</p>
        <button>buy now</button>
    </div>

       <div class="product">
        <img src="https://images.pexels.com/photos/27548812/pexels-photo-27548812.jpeg">
        <h2>Filter Coffee</h2>
        <p>Rs 199.00</p>
        <button>buy now</button>
    </div>

  
    
</body>
</html>
