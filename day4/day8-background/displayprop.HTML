<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
             color:red;
        }
        div .ex1{
            display:none;
        }
        div .ex2{
            display:block;
            background-color: antiquewhite;
        }
        div .ex3{
            display: inline;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div>
        display : none, means to show nothinf / simply it will the content
        <p class="ex1">Hello display none</p>
    </div>
    <div>
        Display : Block , it is similar to div container , bcz it takes 100% width of space
        <p class="ex2">Hello display block</p>
    </div>
    <div>
        display : inline , it is similar to spam tag, bcz it take requred amount of width
        <p class="ex3">Hello Display Inline</p>
    </div>
</body>
</html>
