<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product{
            background-color: aqua;
            height: 500px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 25px;
            align-items: center;
            /* flex bydefault gives you row format */
            /* flex-direction: row/column */
        }
        .box{
            border: 1px solid black;
            width: 150px;
            height: 150px;
            text-align: center;
            font-weight: bold;
            background-color: antiquewhite;

        }
    </style>
</head>
<body>
    <div class="product">

        <div class="box">Cake</div>
        <div class="box">Cookie</div>
        <div class="box">pastry</div>

    </div>
</body>
</html>
