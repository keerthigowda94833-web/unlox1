<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .products{
            display: grid;
             /* grid-template-columns: repeat(no of columns(max colum 12), size of each colum); */
             /* rid-template-columns: repeat(3,px)); */
            grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
            background-color: brown;
            padding: 10px;
            gap: 25px;
        }

        .box{
            border: 1px solid black;
            background-color: lightcoral;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <div class="products">
        <div class="box">Cake</div>
        <div class="box">Price:20</div>
        <div class="box">Cookie</div>
        <div class="box">price:30</div>
        <div class="box">pastry</div>
        <div class="box">price:50</div>
    </div>
</body>
</html>
