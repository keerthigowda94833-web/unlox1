<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Report UI</title>
    <link rel="stylesheet" href="stylepro.CSS">
</head>
<body>

<div class="container">

    <div class="report-card">
        <h2>Financial Report, December 25, 2026</h2>

        <div class="blue-card">

            <div class="top-section">
                <div>
                    <p class="money-title">Current Money</p>
                    <h1>$536,67</h1>
                </div>

                <button class="details-btn">Details</button>
            </div>

            <div class="category-buttons">
                <button>Daily Bills</button>
                <button>Vehicle</button>
                <button>Meal Cost</button>
            </div>

            <div class="add-section">
                <div class="plus-btn">+</div>
                <p>Add custom data</p>
            </div>

        </div>
    </div>

</div>

</body>
</html>
